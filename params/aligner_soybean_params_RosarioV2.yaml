## Input Parameters:
input_clouds:

  # Path, Name, and Type of the Clouds to Align
  cloud_fixed_path:                   RosarioV2Dron 
  cloud_fixed_name:                   dron_points_xyz
  cloud_moving_path:                  RosarioV2Ground
  cloud_moving_name:                  processed_xyz_rotated
  relative_scale:	  	      [1, 1] 

## Other Parameters
aligner_params:  
  # Dense Opt. Flow, and Final Ref. Params
  max_iter_number:                    10
  verbosity:                          true
  store_dense_optical_flow:           true
  show_dpf_correspondences:           true
  dense_optical_flow_step:            3
  downsampling_rate:                  0.15
  search_radius:                      0.15
  use_visual_features:                true
  visual_features_weight:	            1
  use_geometric_features:             false
  geometric_features_weight:          0.5 

